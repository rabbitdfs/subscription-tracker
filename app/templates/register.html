
{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="card auth">
  <h1>Регистрация</h1>
  <form id="register-form">
    <label>Почта <input id="email" type="email" required></label>
    <label>Пароль, не короче 8 символов <input id="password" type="password" minlength="8" required></label>
    <p id="error" class="error"></p>
    <button type="submit">Зарегистрироваться</button>
  </form>
  <p>Уже есть аккаунт? <a href="/login">Войти</a></p>
</div>
{% endblock %}
{% block scripts %}
<script>
  document.getElementById("register-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    try {
      await api("POST", "/api/auth/register", {
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
      });
      window.location.href = "/"; // после регистрации сервер сразу выполняет вход
    } catch (error) {
      document.getElementById("error").textContent = error.message;
    }
  });
</script>
{% endblock %}
